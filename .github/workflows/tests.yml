name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        database: [sqlite, mysql, pgsql]
        exclude:
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pint --test
        if: matrix.database == 'sqlite'

      - name: Run tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.database == 'sqlite' && 'testing' || matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'mysql' && 3306 || 5432 }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
